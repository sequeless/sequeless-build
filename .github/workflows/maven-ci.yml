name: Maven CI (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
      maven-args:
        type: string
        default: verify
    secrets:
      PACKAGES_READ_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Build
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp ${{ inputs.maven-args }}
