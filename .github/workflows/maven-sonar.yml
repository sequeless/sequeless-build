name: SonarCloud (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
      sonar-organization:
        type: string
        default: sequeless
    secrets:
      SONAR_TOKEN:
        required: false
      PACKAGES_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: SonarCloud scan (skipped if SONAR_TOKEN absent)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN not set; skipping SonarCloud scan."
            exit 0
          fi
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" -Dsonar.organization="$SONAR_ORGANIZATION"
